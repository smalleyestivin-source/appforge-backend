name: Build APK
on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'ZIP URL'
        required: true
      app_name:
        description: 'App name'
        required: true
      package_id:
        description: 'Package ID'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install Capacitor
        run: npm install -g @capacitor/cli @ionic/cli
      - name: Download ZIP
        run: curl -L "${{ github.event.inputs.download_url }}" -o project.zip
      - name: Build APK
        run: |
          mkdir app && cd app
          unzip ../project.zip
          npm init -y
          npm install @capacitor/core @capacitor/android
          npx cap init "${{ github.event.inputs.app_name }}" "${{ github.event.inputs.package_id }}" --web-dir=.
          npx cap add android
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
